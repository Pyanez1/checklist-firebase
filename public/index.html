<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control Completitud Mercado</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .card-btn {
      display:flex; align-items:center; justify-content:center;
      padding:1rem; border-radius:0.75rem; font-weight:600;
      font-size:0.875rem; box-shadow:0 1px 2px rgba(0,0,0,.05);
      transition:opacity .15s; text-align:center;
    }
    .card-btn:hover { opacity:.88; }
    .input {
      width:100%; border:1px solid #d1d5db; border-radius:0.5rem;
      padding:0.5rem 0.75rem; font-size:0.875rem; outline:none;
    }
    .input:focus { box-shadow:0 0 0 2px #93c5fd; border-color:#60a5fa; }
    .input-sm {
      width:100%; border:1px solid #d1d5db; border-radius:0.5rem;
      padding:0.25rem 0.5rem; font-size:0.75rem; outline:none;
    }
    .input-sm:focus { box-shadow:0 0 0 1px #93c5fd; }
    .label { display:block; font-size:0.875rem; font-weight:500; color:#374151; margin-bottom:0.25rem; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen">

  <!-- Navbar -->
  <header class="bg-blue-700 text-white shadow-md">
    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="#home" class="flex items-center gap-2 font-bold text-lg hover:opacity-90">
        <span>&#128722;</span>
        <span>Completitud Mercado</span>
      </a>
      <nav class="flex gap-4 text-sm font-medium">
        <a href="#nuevo"   class="hover:text-yellow-300 transition">+ Nuevo</a>
        <a href="#resumen" class="hover:text-yellow-300 transition">Resumen</a>
        <a href="#config"  class="hover:text-yellow-300 transition">Config</a>
      </nav>
    </div>
  </header>

  <!-- Main -->
  <main class="max-w-4xl mx-auto px-4 py-6">
    <div id="app">
      <div class="flex justify-center py-16">
        <div class="animate-spin h-8 w-8 border-4 border-blue-600 border-t-transparent rounded-full"></div>
      </div>
    </div>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
